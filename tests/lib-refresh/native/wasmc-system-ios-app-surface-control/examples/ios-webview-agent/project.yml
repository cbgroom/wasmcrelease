name: WAsmCIOSWebViewAgent
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.webview-agent-lab
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  WAsmCIOSWebViewAgent:
    type: application
    platform: iOS
    info:
      path: ${WASMC_IOS_WEBVIEW_AGENT_INFO_PLIST}
      properties:
        CFBundleShortVersionString: "0.0.3"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    sources:
      - path: App
        excludes: [Info.plist]
      - path: ../../../../../../libspec/wasmc-system-ios-app-surface-control/platform/ios/Sources/WebViewSurfaceProvider.swift
      - path: ../../../../../../host/tests/ios-app-capability/Host/FixedHost.swift
    settings:
      base:
        PRODUCT_NAME: WAsmCIOSWebViewAgent
  WAsmCIOSWebViewAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WAsmCIOSWebViewAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.webview-agent-lab.uitests
        TEST_TARGET_NAME: WAsmCIOSWebViewAgent
