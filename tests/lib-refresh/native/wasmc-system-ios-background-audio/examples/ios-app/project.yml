name: WAsmCIOSBackgroundAudio
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.background-audio-lab
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  WAsmCIOSBackgroundAudio:
    type: application
    platform: iOS
    info:
      path: ${WASMC_IOS_BACKGROUND_AUDIO_INFO_PLIST}
      properties:
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    sources:
      - path: App
        excludes: [Info.plist]
      - path: ../../../../../../libspec/wasmc-system-ios-background-audio/platform/ios/Sources
      - path: ../../../../../../host/tests/ios-app-capability/Host/FixedHost.swift
    settings:
      base:
        PRODUCT_NAME: WAsmCIOSBackgroundAudio
  WAsmCIOSBackgroundAudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WAsmCIOSBackgroundAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.background-audio-lab.uitests
        TEST_TARGET_NAME: WAsmCIOSBackgroundAudio
