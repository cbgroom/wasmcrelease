name: Nonblocking Host read ownership
on:
  push:
    branches: [main, work/host-nonblocking-read-owner]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-read-owner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
      - run: rustup override set 1.96.0
      - run: cargo fmt --check --manifest-path host/completion/rust/Cargo.toml
      - name: Native clock and entropy sources (not guest v1 qualification)
        run: cargo test --release --locked --manifest-path host/completion/rust/Cargo.toml --test environment
      - run: cargo clippy --release --locked --manifest-path host/completion/rust/Cargo.toml --lib --tests -- -D warnings
      - name: Real TCP lifecycle and retained quota controls
        run: node scripts/test-host-nonblocking-read.mjs "$RUNNER_TEMP/nonblocking-read.json"
      - run: cargo clippy --release --locked --manifest-path host/completion/rust/Cargo.toml --features native-readiness --lib --tests -- -D warnings
      - name: OS readiness, shared reactor and independent cancellation wakeups
        run: node scripts/test-host-nonblocking-read.mjs --readiness "$RUNNER_TEMP/readiness.json"
      - name: Summary
        run: |
          printf '%s\n' "Source $GITHUB_SHA; $RUNNER_OS/$RUNNER_ARCH: default25 + readiness38 tests (6 OS wakeup + 7 shared reactor controls). No guest async/executor/mobile qualification." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonblocking-read-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/nonblocking-read.json
            ${{ runner.temp }}/readiness.json
          if-no-files-found: error
  js-environment-sources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - run: node scripts/test-host-scenario-plan.mjs
      - run: node host/scenarios/environment-test.mjs
      - run: bun host/scenarios/environment-test.mjs
      - run: deno run host/scenarios/environment-test.mjs
      - run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - name: Build public Rust conformance caller, no Cargo or private source
        run: rustc +1.96.0 --edition=2024 --crate-type cdylib --target wasm32-unknown-unknown -C opt-level=s -C panic=abort -C strip=symbols host/scenarios/environment-app.rs -o "$RUNNER_TEMP/environment-rust.wasm"
      - name: App to real clock and entropy to admitted Lib, both callers
        run: |
          node host/scenarios/environment-app-test.mjs "$RUNNER_TEMP/environment-rust.wasm" > "$RUNNER_TEMP/environment-node.json"
          bun host/scenarios/environment-app-test.mjs "$RUNNER_TEMP/environment-rust.wasm" > "$RUNNER_TEMP/environment-bun.json"
          deno run --allow-read host/scenarios/environment-app-test.mjs "$RUNNER_TEMP/environment-rust.wasm" > "$RUNNER_TEMP/environment-deno.json"
          node --input-type=module -e 'import fs from "node:fs"; for (const name of ["node","bun","deno"]) { const p = `${process.env.RUNNER_TEMP}/environment-${name}.json`; const receipt = JSON.parse(fs.readFileSync(p)); receipt.exact_source = process.env.GITHUB_SHA; receipt.os = process.env.RUNNER_OS; receipt.arch = process.env.RUNNER_ARCH; fs.writeFileSync(p, JSON.stringify(receipt)); console.log(JSON.stringify(receipt)); }'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-app-${{ matrix.os }}
          path: ${{ runner.temp }}/environment-*.json
          if-no-files-found: error
      - name: Evidence boundary
        run: |
          printf '%s\n' "Source $GITHUB_SHA; $RUNNER_OS/$RUNNER_ARCH: Node/Bun/Deno source preflight and restricted synchronous WAsmC/Rust App-Lib-Host profile. No uniform v1 resource ABI, Native engine, browser or mobile proof." >> "$GITHUB_STEP_SUMMARY"
