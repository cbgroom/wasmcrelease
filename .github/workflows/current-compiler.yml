name: Current compiler-only distribution
on:
  push:
    branches: [main]
    paths: ['current/**', 'dist/**', 'package/**', 'runtime/**', 'scripts/*current-compiler*.mjs', '.github/workflows/current-compiler.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - name: Singleton compiler and exact three-engine outputs
        run: |
          node scripts/current-compiler-integrity.mjs --require-qualification
          node scripts/test-current-compiler.mjs
          bun scripts/test-current-compiler.mjs
          deno run --allow-read --allow-write --allow-run --allow-env scripts/test-current-compiler.mjs
          node examples/current/standard.mjs
          bun examples/current/standard.mjs
          deno run --allow-read examples/current/standard.mjs
      - name: Source-free archive and actual rejection controls
        run: |
          stage="$(mktemp -d)"
          git archive HEAD | tar -xf - -C "$stage"
          cd "$stage"
          node scripts/test-current-compiler.mjs
          node scripts/test-current-compiler-integrity.mjs
