name: Normal Lib aggregate-memory successor
on:
  push:
    branches: [work/WS-20261026-lib-memory-release-v031]
    paths: ['.agents/workstreams/WS-20261026-lib-memory-release-v031/producer/**', '.github/workflows/lib-memory-v031.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  json:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/lib-memory-v031
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Materialize one changed Lib only and inspect resource admission
        run: |
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage('.').free
          print({'free_GiB':free/2**30,'floor_GiB':12,'pool_budget_GiB':2,'lane':'disposable changed-Lib CI; no local persistent Cargo pool'})
          assert free>=12*2**30
          PY
          node .agents/workstreams/WS-20261026-lib-memory-release-v031/producer/materialize.mjs "$RUNNER_TEMP/lib-memory-json"
          python3 .agents/workstreams/WS-20261026-lib-memory-release-v031/producer/materialize-additional.py "$RUNNER_TEMP/lib-memory-additional"
          mkdir -p target/lib-memory-evidence
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target/lib-memory-v031
          key: lib-memory-linux-rust196-${{ hashFiles('.agents/workstreams/WS-20261026-lib-memory-release-v031/producer/inputs/cohort.Cargo.lock', '.agents/workstreams/WS-20261026-lib-memory-release-v031/producer/inputs/cohort-rust-policy.json') }}-${{ hashFiles('.agents/workstreams/WS-20261026-lib-memory-release-v031/producer/libspec/**') }}
          restore-keys: lib-memory-linux-rust196-${{ hashFiles('.agents/workstreams/WS-20261026-lib-memory-release-v031/producer/inputs/cohort.Cargo.lock', '.agents/workstreams/WS-20261026-lib-memory-release-v031/producer/inputs/cohort-rust-policy.json') }}-
      - name: Exact Rust, Native tests and portable changed-Lib build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
          set -o pipefail
          gh run download 40373158771 --repo cbgroom/wasmcrelease --name lib-memory-json --dir "$RUNNER_TEMP/json-qualified"
          python3 - <<'PYREUSE'
          import json,hashlib,os,pathlib,shutil
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          source=json.loads((p/'lib-memory-json/source-receipt.json').read_text())
          prior=json.loads((p/'json-qualified/source-receipt.json').read_text())
          assert source==prior, 'changed JSON source requires fresh qualification instead of baseline reuse'
          assert (p/'json-qualified/source.txt').read_text().strip()=='805853f2b774a9603f1d31b646eb0ab5cf9e58ff'
          assert hashlib.sha256((p/'json-qualified/json-raw.wasm').read_bytes()).hexdigest()=='8bf27c964cdf4d772ab9cd55d3d8d52631d6dd644f47651f2ebae41f1380a559'
          for name in ['json-raw.wasm','source-receipt.json','native.log','wasm.log']:
              shutil.copy(p/'json-qualified'/name,pathlib.Path('target/lib-memory-evidence')/name)
          pathlib.Path('target/lib-memory-evidence/json-reuse.json').write_text(json.dumps({'reused_run':40373158771,'source':'805853f2b774a9603f1d31b646eb0ab5cf9e58ff','unchanged_four_file_source':True,'fresh_json_rust_build':False}))
          PYREUSE
          gh run download 40377176188 --repo cbgroom/wasmcrelease --name lib-memory-json --dir "$RUNNER_TEMP/seven-qualified"
          python3 - <<'PYSEVEN'
          import json,hashlib,pathlib,os,shutil
          own=pathlib.Path('.agents/workstreams/WS-20261026-lib-memory-release-v031/producer')
          pin=json.loads((own/'inputs/seven-qualified.json').read_text())
          old=pathlib.Path(os.environ['RUNNER_TEMP'])/'seven-qualified'
          current=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'lib-memory-additional/source-receipt.json').read_text())
          prior=json.loads((old/'additional-source-receipt.json').read_text())
          assert prior==pin['additional_source'] and (old/'source.txt').read_text().strip()==pin['source']
          for name,value in prior['inputs'].items():assert current['inputs'][name]==value,name
          for field in ['policy_sha256','cohort_lock_sha256']:assert current[field]==prior[field]
          for name,sha in pin['raw_files'].items():
              assert hashlib.sha256((old/name).read_bytes()).hexdigest()==sha,name
              shutil.copy(old/name,pathlib.Path('target/lib-memory-evidence')/name)
          pathlib.Path('target/lib-memory-evidence/seven-reuse.json').write_text(json.dumps({'run':pin['run'],'source':pin['source'],'fresh_seven_lib_builds':False,'all_inputs_unchanged':True}))
          PYSEVEN
          cp "$RUNNER_TEMP/lib-memory-additional/Cargo.lock" target/lib-memory-evidence/additional.Cargo.lock
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/lib-memory-additional/Cargo.toml"
          cargo test -p wasmc_std_memory_v031 --offline --locked --manifest-path "$RUNNER_TEMP/lib-memory-additional/Cargo.toml" 2>&1 | tee target/lib-memory-evidence/std-native.log
          cargo build -p wasmc_std_memory_v031 --offline --locked --release --target wasm32-unknown-unknown --manifest-path "$RUNNER_TEMP/lib-memory-additional/Cargo.toml" 2>&1 | tee target/lib-memory-evidence/std-wasm.log
          cp "$RUNNER_TEMP/lib-memory-additional/source-receipt.json" target/lib-memory-evidence/additional-source-receipt.json
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/wasmc_std_memory_v031.wasm" target/lib-memory-evidence/std-raw.wasm
          python3 - <<'PYRESOURCE'
          import os,shutil
          total=sum(os.path.getsize(os.path.join(p,n)) for p,_,ns in os.walk(os.environ['CARGO_TARGET_DIR']) for n in ns)
          print({'target_bytes':total,'budget_bytes':2*2**30,'remaining_GiB':shutil.disk_usage('.').free/2**30})
          assert total<2*2**30
          PYRESOURCE
          rustc -vV > target/lib-memory-evidence/rustc.txt
          cargo -vV > target/lib-memory-evidence/cargo.txt
          git rev-parse HEAD > target/lib-memory-evidence/source.txt
          sha256sum target/lib-memory-evidence/json-raw.wasm > target/lib-memory-evidence/sha256.txt
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lib-memory-json
          path: target/lib-memory-evidence/**
          retention-days: 30
          if-no-files-found: error
