name: Host UInput Lib qualification

on:
  push:
    branches: [main, work/host-lib-defined-boundary-v1]
    paths:
      - "host/runtime/lib-boundary/native-linux/**"
      - "libsrc/wasmc-system-linux-uinput/**"
      - "scripts/test-linux-uinput-lib-defined-boundary.mjs"
      - ".github/workflows/host-uinput.yml"
  pull_request:
    paths:
      - "host/runtime/lib-boundary/native-linux/**"
      - "libsrc/wasmc-system-linux-uinput/**"
      - "scripts/test-linux-uinput-lib-defined-boundary.mjs"
      - ".github/workflows/host-uinput.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-1.255.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-tools >/dev/null || [ "$(wasm-tools --version)" != "wasm-tools 1.255.0" ]; then
            cargo install wasm-tools --version 1.255.0 --locked
          fi
      - name: Expose real uinput device
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe uinput || true
          minor="$(awk '$2 == "uinput" { print $1 }' /proc/misc)"
          test -n "$minor"
          if [ ! -e /dev/uinput ]; then
            sudo mknod /dev/uinput c 10 "$minor"
          fi
          sudo chmod 600 /dev/uinput
      - name: Qualify Lib-defined UInput through fixed Host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/lib-defined-boundary-linux-uinput
          sudo env \
            HOME="$HOME" \
            PATH="$PATH" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            WASMC_UINPUT_RECEIPT="$GITHUB_WORKSPACE/target/lib-defined-boundary-linux-uinput/report.json" \
            node scripts/test-linux-uinput-lib-defined-boundary.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-uinput-${{ github.sha }}
          path: target/lib-defined-boundary-linux-uinput/report.json
          if-no-files-found: warn
