name: System telemetry candidate
on:
  pull_request:
    paths:
      - 'libsrc/wasmc-system-telemetry/**'
      - 'examples/system-telemetry/**'
      - 'admission/system-telemetry-v1/**'
      - 'scripts/*telemetry*'
      - '.github/workflows/system-telemetry-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-component:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin consumer compiler
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc -Vv
      - name: Verify candidate package and run source-free Component caller
        shell: bash
        run: bash scripts/test-telemetry-component.sh
      - name: Native parser unit tests
        shell: bash
        run: cargo test --locked --manifest-path libsrc/wasmc-system-telemetry/Cargo.toml
      - name: Real Linux collection and bounded resource reads
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --locked --manifest-path libsrc/wasmc-system-telemetry/Cargo.toml --example linux
          cargo run --release --locked --manifest-path libsrc/wasmc-system-telemetry/Cargo.toml --example linux
      - name: Scope boundary
        shell: bash
        run: |
          echo 'This candidate workflow does not qualify WAsmC source consumption, Browser, Wasmi, production catalog or immutable release.'
          git rev-parse HEAD
