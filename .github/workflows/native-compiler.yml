name: Native WAsmC CLI
on:
  push:
    branches: [main, work/native-wasmi-compiler, work/unified-native-cli-aot-v1]
  pull_request:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact Native SDK source commit; empty selects this workflow commit
        required: false
        default: ''
        type: string
      verify_existing_run:
        description: Download-consumer verification only from an existing run; no Rust build
        required: false
        default: ''
        type: string
      windows_only:
        description: Recover only Windows targets; leave completed Linux/macOS builds intact
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
env:
  SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
jobs:
  native:
    if: ${{ !inputs.verify_existing_run }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.verify_existing_run && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"macos-14","target":"aarch64-apple-darwin"}]' || inputs.windows_only && '[{"os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"macos-14","target":"aarch64-apple-darwin"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - name: Exact Native source checkout
        run: node -e "const a=require('node:assert/strict');const c=require('node:child_process');const s=process.env.SOURCE_COMMIT;a.match(s,/^[a-f0-9]{40}$/);a.equal(c.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),s);console.log(JSON.stringify({accepted:true,source_commit:s,workflow_revision:process.env.GITHUB_SHA,checkout_scope:'complete source tree'}))"
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.96.0 test --locked --manifest-path sdk/wasmc-native-compiler/Cargo.toml
      - run: cargo +1.96.0 clippy --locked --manifest-path sdk/wasmc-native-compiler/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.96.0 build --release --locked --manifest-path sdk/wasmc-native-compiler/Cargo.toml
      - run: node scripts/native-package.mjs build native-package ${{ matrix.target }} ${{ env.SOURCE_COMMIT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasmc-${{ matrix.target }}-${{ env.SOURCE_COMMIT }}
          path: native-package/
          if-no-files-found: error
  downloaded-consumer:
    needs: native
    if: ${{ always() && (inputs.verify_existing_run != '' || needs.native.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.verify_existing_run && '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"macos-14","target":"aarch64-apple-darwin"}]' || inputs.windows_only && '[{"os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' || '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"macos-15-intel","target":"x86_64-apple-darwin"},{"os":"macos-14","target":"aarch64-apple-darwin"},{"os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - name: Exact Native source checkout
        run: node -e "const a=require('node:assert/strict');const c=require('node:child_process');const s=process.env.SOURCE_COMMIT;a.match(s,/^[a-f0-9]{40}$/);a.equal(c.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),s);console.log(JSON.stringify({accepted:true,source_commit:s,workflow_revision:process.env.GITHUB_SHA,checkout_scope:'complete source tree'}))"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasmc-${{ matrix.target }}-${{ env.SOURCE_COMMIT }}
          path: downloaded/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verify_existing_run || github.run_id }}
      - run: node scripts/native-package.mjs verify downloaded ${{ matrix.target }} ${{ env.SOURCE_COMMIT }}
      - run: node scripts/test-native-package.mjs downloaded ${{ matrix.target }} ${{ env.SOURCE_COMMIT }}
