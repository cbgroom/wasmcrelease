name: LibSearch portable equivalence
on:
  push:
    branches: [main, release/lib-search-v010]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lib-search-${{ github.ref }}
  cancel-in-progress: false
jobs:
  javascript:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        runtime: [node18, node22, node26, bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.runtime == 'node18' && '18.19.1' || matrix.runtime == 'node22' && '22.0.0' || '26.5.1' }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - name: Formal API, public compiler independent WAsmC and typed client
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p target/lib-search
          runner=(node)
          if [[ "$RUNTIME" == bun ]]; then runner=(bun); fi
          if [[ "$RUNTIME" == deno ]]; then runner=(deno run --allow-read); fi
          node scripts/test-release-channel.mjs
          node scripts/release-candidate.mjs verify channels/candidates/0.0.10.json
          "${runner[@]}" examples/lib-search/verify-api.mjs examples/lib-search/index.lsi standard/wasmc-lib-search/0.1.0 examples/lib-search/search-reference.wasmc current/wasmc.mjs "$GITHUB_SHA" | tee target/lib-search/api.json
          "${runner[@]}" examples/lib-search/run.mjs | tee target/lib-search/client.json
          printf '%s\n' "Exact tested source: $GITHUB_SHA; runtime: $RUNTIME" >> "$GITHUB_STEP_SUMMARY"
          cat target/lib-search/api.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lib-search-${{ matrix.os }}-${{ matrix.runtime }}
          path: target/lib-search/**
          if-no-files-found: error
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      WASMC_SEARCH_LIB_ROOT: ${{ github.workspace }}/standard/wasmc-lib-search/0.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Actual Wasmi Core and generated Rust Component SDK
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          cargo +1.96.0 test --locked --release --manifest-path examples/lib-search/rust/Cargo.toml
          cargo +1.96.0 run --locked --release --manifest-path examples/lib-search/rust/Cargo.toml
  required:
    if: always()
    needs: [javascript, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Reject failed skipped or incomplete matrices
        env:
          JS_RESULT: ${{ needs.javascript.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$JS_RESULT" = success
          test "$RUST_RESULT" = success
          printf '%s\n' "LibSearch matrix PASS at $GITHUB_SHA (10 JS cells + actual Wasmi + generated Component SDK)." >> "$GITHUB_STEP_SUMMARY"
