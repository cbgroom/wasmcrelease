name: JSON007 standalone Lib
on:
  push:
    branches: [main, work/WS-20261025-json-lib-release-v007]
    paths: ['lib-releases/wasmc-json/0.0.7/**', '.github/workflows/json-lib-v007.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, deno, bun-compiler-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - if: matrix.runtime == 'bun-compiler-only'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - if: matrix.runtime == 'node'
        run: node lib-releases/wasmc-json/0.0.7/verify.mjs
      - if: matrix.runtime == 'deno'
        run: deno run --allow-read=lib-releases/wasmc-json/0.0.7 lib-releases/wasmc-json/0.0.7/verify.mjs
      - if: matrix.runtime == 'bun-compiler-only'
        run: bun run lib-releases/wasmc-json/0.0.7/verify.mjs --compiler-only
