name: Public Lib source incubation

on:
  pull_request:
    paths:
      - "libsrc/**"
      - "CONTRIBUTING.md"
      - "docs/LIB_GRADUATION.md"
      - "scripts/validate-libsrc.mjs"
      - "scripts/test-router-policy.mjs"
      - "scripts/test-json-libsrc.mjs"
      - "scripts/test-compression-libsrc.mjs"
      - "scripts/test-http1-libsrc.mjs"
      - "scripts/test-tls-libsrc.mjs"
      - "scripts/test-libsrc-all.mjs"
      - "scripts/test-libsrc-wasmi.mjs"
      - "scripts/test-data-core-libsrc.mjs"
      - "scripts/test-csv-libsrc.mjs"
      - "scripts/test-data-expr-libsrc.mjs"
      - "scripts/test-data-compute-libsrc.mjs"
      - "scripts/test-data-relational-libsrc.mjs"
      - "scripts/test-data-interchange-libsrc.mjs"
      - "scripts/test-data-pipeline.mjs"
      - "libsrc/qualification/**"
      - ".github/workflows/lib-source.yml"
  push:
    branches: [main]
    paths:
      - "libsrc/**"
      - "CONTRIBUTING.md"
      - "docs/LIB_GRADUATION.md"
      - "scripts/validate-libsrc.mjs"
      - "scripts/test-router-policy.mjs"
      - "scripts/test-json-libsrc.mjs"
      - "scripts/test-compression-libsrc.mjs"
      - "scripts/test-http1-libsrc.mjs"
      - "scripts/test-tls-libsrc.mjs"
      - "scripts/test-libsrc-all.mjs"
      - "scripts/test-libsrc-wasmi.mjs"
      - "scripts/test-data-core-libsrc.mjs"
      - "scripts/test-csv-libsrc.mjs"
      - "scripts/test-data-expr-libsrc.mjs"
      - "scripts/test-data-compute-libsrc.mjs"
      - "scripts/test-data-relational-libsrc.mjs"
      - "scripts/test-data-interchange-libsrc.mjs"
      - "scripts/test-data-pipeline.mjs"
      - "libsrc/qualification/**"
      - ".github/workflows/lib-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 47.0.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-1.255.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            libsrc-v5-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libsrc/wasmc-json/target
            libsrc/wasmc-compression/target
            libsrc/wasmc-http1/target
            libsrc/wasmc-tls-core/target
            libsrc/wasmc-tls-core/tests/host/target
            libsrc/wasmc-data-core/target
            libsrc/wasmc-csv/target
            libsrc/wasmc-data-expr/target
            libsrc/wasmc-data-compute/target
            libsrc/wasmc-data-relational/target
            libsrc/wasmc-data-interchange/target
            libsrc/qualification/wasmi-core/target
          key: libsrc-build-v7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libsrc/wasmc-json/Cargo.lock', 'libsrc/wasmc-compression/Cargo.lock', 'libsrc/wasmc-http1/Cargo.lock', 'libsrc/wasmc-tls-core/Cargo.lock', 'libsrc/wasmc-tls-core/tests/host/Cargo.lock', 'libsrc/wasmc-data-core/Cargo.lock', 'libsrc/wasmc-csv/Cargo.lock', 'libsrc/wasmc-data-expr/Cargo.lock', 'libsrc/wasmc-data-compute/Cargo.lock', 'libsrc/wasmc-data-relational/Cargo.lock', 'libsrc/wasmc-data-interchange/Cargo.lock', 'libsrc/qualification/wasmi-core/Cargo.lock') }}
          restore-keys: |
            libsrc-v5-${{ runner.os }}-${{ runner.arch }}-
            libsrc-build-v2-${{ runner.os }}-${{ runner.arch }}-
            libsrc-build-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-tools >/dev/null || [ "$(wasm-tools --version)" != "wasm-tools 1.255.0" ]; then
            cargo install wasm-tools --version 1.255.0 --locked
          fi
      - name: Validate public Lib source registry
        run: node scripts/validate-libsrc.mjs
      - name: Qualify all registered public Lib source candidates
        run: node scripts/test-libsrc-all.mjs
      - name: Execute import-free candidates on Wasmi 2
        run: node scripts/test-libsrc-wasmi.mjs
      - name: Report Lib source admission readiness
        run: |
          mkdir -p target
          node scripts/libsrc-readiness.mjs | tee target/libsrc-readiness.json
      - name: Repository integrity
        run: |
          node scripts/validate-integrity.mjs
          ./scripts/validate-maintainer.sh

  tls-portability:
    name: TLS portability (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-14
            platform: macos-aarch64
          - runner: windows-2025
            platform: windows-x86_64
          - runner: windows-11-arm
            platform: windows-aarch64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/wasm-tools
            ~/.cargo/registry
            ~/.cargo/git
            libsrc/wasmc-tls-core/target
            libsrc/wasmc-tls-core/tests/host/target
          key: tls-libsrc-v1-${{ matrix.platform }}-${{ hashFiles('libsrc/wasmc-tls-core/Cargo.lock', 'libsrc/wasmc-tls-core/tests/host/Cargo.lock') }}
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-tools >/dev/null || [ "$(wasm-tools --version)" != "wasm-tools 1.255.0" ]; then
            cargo install wasm-tools --version 1.255.0 --locked
          fi
      - name: Qualify public TLS core on ${{ matrix.platform }}
        shell: bash
        run: node scripts/test-tls-libsrc.mjs | tee "tls-${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: tls-libsrc-${{ matrix.platform }}
          path: tls-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14
