name: Public Lib source incubation

on:
  pull_request:
    paths:
      - "libsrc/**"
      - "CONTRIBUTING.md"
      - "docs/LIB_GRADUATION.md"
      - "scripts/validate-libsrc.mjs"
      - "scripts/test-router-policy.mjs"
      - "scripts/test-json-libsrc.mjs"
      - "scripts/test-compression-libsrc.mjs"
      - "scripts/test-http1-libsrc.mjs"
      - "scripts/test-tls-libsrc.mjs"
      - ".github/workflows/lib-source.yml"
  push:
    branches: [main]
    paths:
      - "libsrc/**"
      - "CONTRIBUTING.md"
      - "docs/LIB_GRADUATION.md"
      - "scripts/validate-libsrc.mjs"
      - "scripts/test-router-policy.mjs"
      - "scripts/test-json-libsrc.mjs"
      - "scripts/test-compression-libsrc.mjs"
      - "scripts/test-http1-libsrc.mjs"
      - "scripts/test-tls-libsrc.mjs"
      - ".github/workflows/lib-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 47.0.4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-1.255.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            libsrc-v5-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libsrc/wasmc-json/target
            libsrc/wasmc-compression/target
            libsrc/wasmc-http1/target
            libsrc/wasmc-tls-core/target
            libsrc/wasmc-tls-core/tests/host/target
          key: libsrc-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libsrc/wasmc-json/Cargo.lock', 'libsrc/wasmc-compression/Cargo.lock', 'libsrc/wasmc-http1/Cargo.lock', 'libsrc/wasmc-tls-core/Cargo.lock', 'libsrc/wasmc-tls-core/tests/host/Cargo.lock') }}
          restore-keys: |
            libsrc-v5-${{ runner.os }}-${{ runner.arch }}-
            libsrc-build-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-tools >/dev/null || [ "$(wasm-tools --version)" != "wasm-tools 1.255.0" ]; then
            cargo install wasm-tools --version 1.255.0 --locked
          fi
      - name: Validate public Lib source registry
        run: node scripts/validate-libsrc.mjs
      - name: Qualify router graduation candidate
        run: node scripts/test-router-policy.mjs
      - name: Qualify JSON graduation candidate
        run: node scripts/test-json-libsrc.mjs
      - name: Qualify compression graduation candidate
        run: node scripts/test-compression-libsrc.mjs
      - name: Qualify HTTP/1 graduation candidate
        run: node scripts/test-http1-libsrc.mjs
      - name: Qualify TLS core graduation candidate
        run: node scripts/test-tls-libsrc.mjs
      - name: Repository integrity
        run: |
          node scripts/validate-integrity.mjs
          ./scripts/validate-maintainer.sh
