name: Agent Library-first guidance
on:
  push:
    branches: [main, docs/agent-library-first-guidance]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guidance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - run: |
          node scripts/test-agent-guidance.mjs
          node scripts/test-library-first.mjs
          node scripts/release-candidate.mjs verify channels/candidates/0.0.12.json
          ./scripts/validate-maintainer.sh
