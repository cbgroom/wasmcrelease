name: Public Host real file I/O
on:
  push:
    branches: [main, work/thin-host-file-io]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.96.0 fmt --check --manifest-path host/drivers/file/rust/Cargo.toml
      - run: cargo +1.96.0 clippy --locked --manifest-path host/drivers/file/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.96.0 build --release --locked --manifest-path host/drivers/file/rust/Cargo.toml
      - name: Real file permissions, bytes and lifecycle
        shell: bash
        run: |
          binary=host/drivers/file/rust/target/release/wasmc-preopened-file-reference
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/drivers/file/test.mjs "$binary"
      - if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: runner.os != 'Windows'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - if: runner.os != 'Windows'
        name: Bun and restricted Deno real file parity
        shell: bash
        run: |
          binary=host/drivers/file/rust/target/release/wasmc-preopened-file-reference
          bun host/drivers/file/test.mjs "$binary"
          mkdir -p target/host-file-tmp
          TMPDIR="$PWD/target/host-file-tmp" deno run --allow-read=target/host-file-tmp --allow-write=target/host-file-tmp --allow-env=TMPDIR,NODE_V8_COVERAGE --allow-run="$binary" host/drivers/file/test.mjs "$binary"
      - name: Public contract consistency
        if: runner.os == 'Linux'
        run: ./scripts/validate-maintainer.sh
      - name: Exact-source scope
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
        run: |
          printf '%s\n' "Source $SOURCE; $RUNNER_OS/$RUNNER_ARCH; real preopened files, not general guest filesystem/Core transport" >> "$GITHUB_STEP_SUMMARY"
  required:
    if: always()
    needs: file
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.file.result }}
        run: test "$RESULT" = success
