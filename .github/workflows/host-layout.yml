name: Host Lib-defined boundary

on:
  push:
    branches: [main, work/host-canonical-layout-v1, work/host-lib-defined-boundary-v1]
    paths:
      - "host/**"
      - "admission/host-lib-defined-boundary-v1/**"
      - "scripts/validate-host-layout.mjs"
      - "scripts/test-host-lib-defined-boundary.mjs"
      - "scripts/validate-current-platforms.mjs"
      - "docs/HOST_LIB_DEFINED_BOUNDARY.md"
      - "libspec/wasmc-system-*-prototype/**"
      - "libspec/wasmc-system-linux-endpoint/**"
      - "libspec/wasmc-system-linux-uinput/**"
      - "libspec/wasmc-system-linux-socket/**"
      - "libspec/wasmc-system-android-*/**"
      - "libspec/wasmc-system-ios-simulator-*/**"
      - "libspec/wasmc-system-ios-app-*/**"
      - "libspec/wasmc-app-authorization-policy/**"
      - "libspec/registry.json"
      - "scripts/test-lib-defined-boundary-runtime.mjs"
      - "scripts/test-linux-lib-defined-boundary.mjs"
      - "scripts/test-linux-socket-lib-defined-boundary.mjs"
      - "scripts/test-linux-operation-bridge.mjs"
      - "scripts/test-linux-uinput-lib-defined-boundary.mjs"
      - "scripts/validate-android-agent-computer.mjs"
      - "scripts/test-platform-profile-resolver.mjs"
      - "scripts/test-android-agent-computer.mjs"
      - "scripts/validate-ios-simulator-observation.mjs"
      - "scripts/test-ios-simulator-observation.mjs"
      - "scripts/validate-ios-app-capability.mjs"
      - "scripts/test-ios-app-authorization-flow.mjs"
      - "scripts/test-ios-app-capability.mjs"
      - "scripts/validate-ios-app-surface-control.mjs"
      - "scripts/test-ios-app-surface-control.mjs"
      - "scripts/host-https-ab.mjs"
      - ".github/workflows/host-layout.yml"
  pull_request:
    paths:
      - "host/**"
      - "admission/host-lib-defined-boundary-v1/**"
      - "scripts/validate-host-layout.mjs"
      - "scripts/test-host-lib-defined-boundary.mjs"
      - "scripts/validate-current-platforms.mjs"
      - "docs/HOST_LIB_DEFINED_BOUNDARY.md"
      - "libspec/wasmc-system-*-prototype/**"
      - "libspec/wasmc-system-linux-endpoint/**"
      - "libspec/wasmc-system-linux-uinput/**"
      - "libspec/wasmc-system-linux-socket/**"
      - "libspec/wasmc-system-android-*/**"
      - "libspec/wasmc-system-ios-simulator-*/**"
      - "libspec/wasmc-system-ios-app-*/**"
      - "libspec/wasmc-app-authorization-policy/**"
      - "libspec/registry.json"
      - "scripts/test-lib-defined-boundary-runtime.mjs"
      - "scripts/test-linux-lib-defined-boundary.mjs"
      - "scripts/test-linux-socket-lib-defined-boundary.mjs"
      - "scripts/test-linux-operation-bridge.mjs"
      - "scripts/test-linux-uinput-lib-defined-boundary.mjs"
      - "scripts/validate-android-agent-computer.mjs"
      - "scripts/test-platform-profile-resolver.mjs"
      - "scripts/test-android-agent-computer.mjs"
      - "scripts/validate-ios-simulator-observation.mjs"
      - "scripts/test-ios-simulator-observation.mjs"
      - "scripts/validate-ios-app-capability.mjs"
      - "scripts/test-ios-app-authorization-flow.mjs"
      - "scripts/test-ios-app-capability.mjs"
      - "scripts/validate-ios-app-surface-control.mjs"
      - "scripts/test-ios-app-surface-control.mjs"
      - "scripts/host-https-ab.mjs"
      - ".github/workflows/host-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-1.255.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-tools >/dev/null || [ "$(wasm-tools --version)" != "wasm-tools 1.255.0" ]; then
            cargo install wasm-tools --version 1.255.0 --locked
          fi
      - run: node scripts/validate-host-layout.mjs
      - run: node scripts/test-host-lib-defined-boundary.mjs
      - run: node scripts/validate-host-camera-model.mjs
      - run: node scripts/validate-android-agent-computer.mjs
      - run: node scripts/test-platform-profile-resolver.mjs
      - run: node scripts/validate-ios-simulator-observation.mjs
      - run: node scripts/validate-ios-app-capability.mjs
      - run: node scripts/validate-ios-app-surface-control.mjs
      - run: node scripts/validate-current-platforms.mjs
      - name: Retained v0.0.15 domain evidence
        shell: bash
        run: node scripts/report-host-support.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: host-lib-socket-https-migration-${{ github.sha }}
          path: target/https-lib-socket-migration/report.json
          if-no-files-found: warn
