name: Host Lib-defined boundary

on:
  push:
    branches: [main, work/host-canonical-layout-v1, work/host-lib-defined-boundary-v1]
    paths:
      - "host/**"
      - "admission/host-lib-defined-boundary-v1/**"
      - "scripts/validate-host-layout.mjs"
      - "scripts/test-host-lib-defined-boundary.mjs"
      - "scripts/validate-host-lib-defined-boundary-workstream.mjs"
      - "docs/HOST_LIB_DEFINED_BOUNDARY.md"
      - "libsrc/wasmc-system-*-prototype/**"
      - "libsrc/wasmc-system-linux-endpoint/**"
      - "libsrc/registry.json"
      - "scripts/test-lib-defined-boundary-runtime.mjs"
      - "scripts/test-linux-lib-defined-boundary.mjs"
      - ".github/workflows/host-layout.yml"
  pull_request:
    paths:
      - "host/**"
      - "admission/host-lib-defined-boundary-v1/**"
      - "scripts/validate-host-layout.mjs"
      - "scripts/test-host-lib-defined-boundary.mjs"
      - "scripts/validate-host-lib-defined-boundary-workstream.mjs"
      - "docs/HOST_LIB_DEFINED_BOUNDARY.md"
      - "libsrc/wasmc-system-*-prototype/**"
      - "libsrc/wasmc-system-linux-endpoint/**"
      - "libsrc/registry.json"
      - "scripts/test-lib-defined-boundary-runtime.mjs"
      - "scripts/test-linux-lib-defined-boundary.mjs"
      - ".github/workflows/host-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: node scripts/validate-host-layout.mjs
      - run: node scripts/test-host-lib-defined-boundary.mjs
      - run: node scripts/validate-host-camera-model.mjs
      - run: node scripts/test-lib-defined-boundary-runtime.mjs
      - run: node scripts/test-linux-lib-defined-boundary.mjs
      - run: node scripts/validate-host-lib-defined-boundary-workstream.mjs
      - name: Retained v0.0.15 domain evidence
        shell: bash
        run: node scripts/report-host-support.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
