name: Host Lib-defined boundary

on:
  push:
    branches: [main, work/host-canonical-layout-v1, work/host-lib-defined-boundary-v1]
    paths:
      - "host/**"
      - "admission/host-lib-defined-boundary-v1/**"
      - "scripts/validate-host-layout.mjs"
      - "scripts/test-host-lib-defined-boundary.mjs"
      - "scripts/validate-host-lib-defined-boundary-workstream.mjs"
      - "docs/HOST_LIB_DEFINED_BOUNDARY.md"
      - "libsrc/wasmc-system-*-prototype/**"
      - "libsrc/wasmc-system-linux-endpoint/**"
      - "libsrc/wasmc-system-linux-uinput/**"
      - "libsrc/wasmc-system-linux-socket/**"
      - "libsrc/wasmc-system-android-*/**"
      - "libsrc/registry.json"
      - "scripts/test-lib-defined-boundary-runtime.mjs"
      - "scripts/test-linux-lib-defined-boundary.mjs"
      - "scripts/test-linux-socket-lib-defined-boundary.mjs"
      - "scripts/test-linux-operation-bridge.mjs"
      - "scripts/test-linux-uinput-lib-defined-boundary.mjs"
      - "scripts/validate-android-agent-computer.mjs"
      - "scripts/test-platform-profile-resolver.mjs"
      - "scripts/test-android-agent-computer.mjs"
      - "scripts/host-https-ab.mjs"
      - ".github/workflows/host-layout.yml"
  pull_request:
    paths:
      - "host/**"
      - "admission/host-lib-defined-boundary-v1/**"
      - "scripts/validate-host-layout.mjs"
      - "scripts/test-host-lib-defined-boundary.mjs"
      - "scripts/validate-host-lib-defined-boundary-workstream.mjs"
      - "docs/HOST_LIB_DEFINED_BOUNDARY.md"
      - "libsrc/wasmc-system-*-prototype/**"
      - "libsrc/wasmc-system-linux-endpoint/**"
      - "libsrc/wasmc-system-linux-uinput/**"
      - "libsrc/wasmc-system-linux-socket/**"
      - "libsrc/wasmc-system-android-*/**"
      - "libsrc/registry.json"
      - "scripts/test-lib-defined-boundary-runtime.mjs"
      - "scripts/test-linux-lib-defined-boundary.mjs"
      - "scripts/test-linux-socket-lib-defined-boundary.mjs"
      - "scripts/test-linux-operation-bridge.mjs"
      - "scripts/test-linux-uinput-lib-defined-boundary.mjs"
      - "scripts/validate-android-agent-computer.mjs"
      - "scripts/test-platform-profile-resolver.mjs"
      - "scripts/test-android-agent-computer.mjs"
      - "scripts/host-https-ab.mjs"
      - ".github/workflows/host-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-1.255.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wasm-tools >/dev/null || [ "$(wasm-tools --version)" != "wasm-tools 1.255.0" ]; then
            cargo install wasm-tools --version 1.255.0 --locked
          fi
      - run: node scripts/validate-host-layout.mjs
      - run: node scripts/test-host-lib-defined-boundary.mjs
      - run: node scripts/validate-host-camera-model.mjs
      - run: node scripts/test-lib-defined-boundary-runtime.mjs
      - run: node scripts/test-linux-lib-defined-boundary.mjs
      - run: node scripts/test-linux-socket-lib-defined-boundary.mjs
      - run: node scripts/test-linux-operation-bridge.mjs
      - run: node scripts/validate-android-agent-computer.mjs
      - run: node scripts/test-platform-profile-resolver.mjs
      - name: Qualify Lib-defined socket HTTPS migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/https-lib-socket-migration
          cargo build --release --locked --manifest-path host/tests/https/Cargo.toml --bin wasmc-host-https-qualification
          cp host/tests/https/target/release/wasmc-host-https-qualification target/https-lib-socket-migration/baseline
          cargo build --release --locked --manifest-path host/tests/https/Cargo.toml --features lib-defined-socket --bin wasmc-host-https-qualification
          cp host/tests/https/target/release/wasmc-host-https-qualification target/https-lib-socket-migration/candidate
          WASMC_HTTPS_AB_PROFILE=lib-defined-socket-migration \
          WASMC_LIB_BOUNDARY_IN_PROCESS=1 \
          WASMC_LIB_BOUNDARY_EXECUTOR="$GITHUB_WORKSPACE/target/lib-defined-boundary-operation-bridge/bridge/release/wasmc-lib-boundary-native-linux-operation" \
          WASMC_LIB_SOCKET_DESCRIPTOR="$GITHUB_WORKSPACE/target/lib-defined-boundary-operation-bridge/native-boundary.json" \
          node scripts/host-https-ab.mjs \
            target/https-lib-socket-migration/baseline \
            target/https-lib-socket-migration/candidate \
            linux-x86_64 \
            target/https-lib-socket-migration/report.json
      - run: node scripts/validate-host-lib-defined-boundary-workstream.mjs
      - name: Retained v0.0.15 domain evidence
        shell: bash
        run: node scripts/report-host-support.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-lib-socket-https-migration-${{ github.sha }}
          path: target/https-lib-socket-migration/report.json
          if-no-files-found: warn
