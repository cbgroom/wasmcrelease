name: Source-free consumer verification
on:
  push:
    branches: [main, work/system-telemetry-release-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-free-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-compatibility:
    name: Compatibility ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['18.19.1', '22.0.0', '26.5.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Feature, exact-resolution, install-fault and compiler-only regression
        env:
          WASMC_CI_LABEL: compatibility-${{ matrix.os }}-${{ matrix.node }}
        run: node scripts/ci-suite.mjs compatibility
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-compatibility-${{ matrix.os }}-${{ matrix.node }}
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error
  integrity-and-javascript:
    name: Integrity, Agent guidance and reporting controls
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Integrity and deterministic Agent journeys
        env:
          WASMC_CI_LABEL: integrity-ubuntu
        run: node scripts/ci-suite.mjs integrity
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-integrity
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error
  runtime-consumer:
    name: ${{ matrix.runtime }} ${{ matrix.os }} ${{ matrix.mirror }} full journey
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        runtime: [node, bun, deno]
        mirror: [github, jsdelivr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - name: Source-free deployment, full expressions/managed/standard, fresh mirror install
        env:
          WASMC_CI_LABEL: runtime-${{ matrix.os }}-${{ matrix.runtime }}-${{ matrix.mirror }}
        run: node scripts/ci-suite.mjs runtime "${{ matrix.runtime }}" "${{ matrix.mirror }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-runtime-${{ matrix.os }}-${{ matrix.runtime }}-${{ matrix.mirror }}
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error
  security-history:
    name: All-reachable history and credential rejection boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Preserve raw hits and require zero unresolved findings/skips/errors
        env:
          WASMC_CI_LABEL: security-full-history
        run: node scripts/ci-suite.mjs security
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-security
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error
  rust-wasmtime-and-libs:
    name: Release-profile Rust, Wasmi, Wasmtime and Component Libs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Install stable Rust and capture versions
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Run locked release consumer and runtime SDK qualification
        env:
          WASMC_CI_LABEL: rust-release-ubuntu
        run: node scripts/ci-suite.mjs rust
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-rust
          path: target/ci/**
          retention-days: 14
          if-no-files-found: error
  verification-summary:
    name: Required aggregate verification and downloadable report
    if: always()
    needs: [core-compatibility, integrity-and-javascript, runtime-consumer, security-history, rust-wasmtime-and-libs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Collect all matrix receipts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-*
          path: target/ci-downloads
      - name: Fail closed for failed/skipped/missing/source-mismatched reports
        if: always()
        env:
          WASMC_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-summary.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-report
          path: target/ci-aggregate/**
          retention-days: 30
          if-no-files-found: error
