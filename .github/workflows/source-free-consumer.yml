name: Source-free consumer verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-free-consumer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-compatibility:
    name: Node ${{ matrix.node }} artifact compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['18.19.1', '22.0.0', '26.5.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify supported features and intentional rejection boundaries
        run: node scripts/test-core-compatibility.mjs
      - name: Verify compiler and expressions independently of managed Host support
        run: node scripts/validate-current.mjs --compile-only

  integrity-and-javascript:
    name: Integrity and JavaScript facade
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out public release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release identity and Lib contracts
        run: ./scripts/validate-maintainer.sh
      - name: Compile and execute the public JavaScript baseline
        run: node examples/agent-start/run.mjs
      - name: Verify artifact compatibility and rejection boundaries
        run: node scripts/test-core-compatibility.mjs

  runtime-consumer:
    name: ${{ matrix.runtime }} source-free deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Check out public release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4
      - name: Deploy, compile, instantiate, and run
        run: ./scripts/validate-source-free-runtime.sh "${{ matrix.runtime }}"
      - name: Test latest compiler and shared standard Lib callers
        shell: bash
        run: |
          case "${{ matrix.runtime }}" in
            node|bun)
              "${{ matrix.runtime }}" scripts/validate-current.mjs
              "${{ matrix.runtime }}" examples/current/standard.mjs
              ;;
            deno)
              deno run --allow-read --allow-write --allow-run --allow-env scripts/validate-current.mjs
              deno run --allow-read examples/current/standard.mjs
              ;;
          esac

  rust-wasmtime-and-libs:
    name: Rust, Wasmtime, and Lib behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public release repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latest stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Validate Lib package contracts
        run: node scripts/validate-libs.mjs
      - name: Compile and test the Rust Wasmtime consumer
        working-directory: examples/rust-wasmtime
        run: cargo test --locked
      - name: Compile and test the public Wasmi plus Wasmtime Core Runtime SDK
        run: cargo test --locked -p wasmc-core-runtime
      - name: Run compiler, resource Lib, and Host Lib journey
        working-directory: examples/rust-wasmtime
        run: cargo run --locked
