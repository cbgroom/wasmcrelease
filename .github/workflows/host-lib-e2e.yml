name: Public Host and Lib end-to-end
on:
  push:
    branches: [main, work/host-lib-e2e, work/host-completion-guard, work/host-startup-identity, work/host-tcp-endpoint, work/host-tcp-read-stop, work/host-tcp-listener, work/host-resident-app, work/host-tcp-write-outcome, work/host-engine-parity, work/host-resident-benchmark, work/host-stop-failure, work/host-driver-errors, work/host-browser-parity, work/host-quarantine-supervisor, work/host-kernel-engine-parity, work/host-native-owner-supervisor, work/host-scoped-owner-lifetime, work/host-core-negotiation, work/host-tcp-half-close-probe, work/host-core-quota-safety, work/host-corelib-bytes-io]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-compile:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-linux-android, aarch64-unknown-linux-ohos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.96.0 --profile minimal
      - env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET" --toolchain 1.96.0
      - name: Wasmi-only cross-target check, no device or link claim
        env:
          TARGET: ${{ matrix.target }}
          SOURCE: ${{ github.sha }}
        run: |
          cargo +1.96.0 check --locked --manifest-path host/lib-e2e/rust/Cargo.toml --target "$TARGET" --all-targets
          cargo +1.96.0 tree --locked --manifest-path host/lib-e2e/rust/Cargo.toml --target "$TARGET" > "$RUNNER_TEMP/default-dependencies.txt"
          command -v rg > /dev/null
          if rg '(^|[[:space:]])(wasmtime[^[:space:]]*|wasi[^[:space:]]*|wasip[23]|wat|wast|rustls[^[:space:]]*|openssl[^[:space:]]*|native-tls)([[:space:]]|$)' "$RUNNER_TEMP/default-dependencies.txt"; then exit 1; fi
          printf '%s\n' "Source $SOURCE; $TARGET Wasmi-only compile PASS; no link/sign/install/device/network-permission/runtime qualification" >> "$GITHUB_STEP_SUMMARY"
  stream-shapes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - name: Fast stream ownership and actual JS service proof
        shell: bash
        run: |
          node host/tcp/stream-snapshot-test.mjs
          bun host/tcp/stream-snapshot-test.mjs
          deno run host/tcp/stream-snapshot-test.mjs
          node host/tcp/buffer-budget-test.mjs
          bun host/tcp/buffer-budget-test.mjs
          deno run host/tcp/buffer-budget-test.mjs
          node host/tcp/completion-quarantine-test.mjs --real-tcp
          bun host/tcp/completion-quarantine-test.mjs --real-tcp
          deno run --allow-net=127.0.0.1 host/tcp/completion-quarantine-test.mjs --real-tcp
          node host/file-io/write-snapshot-test.mjs
          bun host/file-io/write-snapshot-test.mjs
          deno run host/file-io/write-snapshot-test.mjs
          node host/file-io/read-completion-test.mjs
          bun host/file-io/read-completion-test.mjs
          deno run host/file-io/read-completion-test.mjs
          node host/corelib-io/snapshot-test.mjs
          bun host/corelib-io/snapshot-test.mjs
          deno run --allow-read=standard/corelib,current,host/corelib-io host/corelib-io/snapshot-test.mjs
          node host/udp/test.mjs
          node host/udp/fault-test.mjs
          node host/udp/retirement-test.mjs
          bun host/udp/test.mjs
          bun host/udp/fault-test.mjs
          bun host/udp/retirement-test.mjs
          deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms host/udp/test.mjs
          deno run --allow-net=127.0.0.1 host/udp/fault-test.mjs
          deno run host/udp/retirement-test.mjs
          node host/tcp/server-test.mjs --js-only
          bun host/tcp/server-test.mjs --js-only --diagnose
          deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms --allow-write=target/host-tcp-app host/tcp/server-test.mjs --js-only
  composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - run: rustup target add wasm32-unknown-unknown --toolchain 1.96.0
      - name: Compile reviewed Rust CoreLib conformance caller
        shell: bash
        run: |
          mkdir -p target/corelib-io
          rustc +1.96.0 --edition=2024 --crate-type=cdylib --target=wasm32-unknown-unknown -O -D warnings -C panic=abort host/corelib-io/private-abi-guest.rs -o target/corelib-io/rust-guest.wasm
      - run: cargo +1.96.0 fmt --check --manifest-path host/completion/rust/Cargo.toml
      - run: cargo +1.96.0 clippy --locked --manifest-path host/completion/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.96.0 build --release --locked --manifest-path host/completion/rust/Cargo.toml
      - run: cargo +1.96.0 test --release --locked --manifest-path host/completion/rust/Cargo.toml
      - run: node host/completion/fault-test.mjs
      - run: node host/completion/lifetime-test.mjs
      - run: node host/tcp/stop-failure-test.mjs
      - run: node host/tcp/driver-error-test.mjs
      - run: node host/file-io/retirement-test.mjs
      - run: node host/file-io/write-snapshot-test.mjs
      - run: node host/file-io/read-completion-test.mjs
      - run: node host/tcp/driver-retirement-test.mjs --real-tcp
      - run: node host/tcp/stream-snapshot-test.mjs
      - run: node host/tcp/buffer-budget-test.mjs
      - run: node host/tcp/completion-quarantine-test.mjs --real-tcp
      - run: node host/corelib-io/snapshot-test.mjs
      - run: node host/tcp/supervisor-test.mjs
      - run: node host/udp/test.mjs
      - run: node host/udp/fault-test.mjs
          node host/udp/retirement-test.mjs
      - name: Independent process startup identity
        shell: bash
        run: |
          binary=host/completion/rust/target/release/scoped-reference
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/completion/scoped-test.mjs "$binary"
      - run: cargo +1.96.0 build --release --locked --manifest-path host/file-io/rust/Cargo.toml
      - name: Existing real file adapter regression
        shell: bash
        run: |
          binary=host/file-io/rust/target/release/wasmc-preopened-file-reference
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/file-io/test.mjs "$binary"
      - name: Session, cancellation and late completion parity
        shell: bash
        run: |
          binary=host/completion/rust/target/release/wasmc-completion-guard
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/completion/test.mjs "$binary"
      - run: cargo +1.96.0 fmt --check --manifest-path host/lib-e2e/rust/Cargo.toml
      - run: cargo +1.96.0 clippy --locked --manifest-path host/lib-e2e/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.96.0 build --release --locked --manifest-path host/lib-e2e/rust/Cargo.toml
      - run: cargo +1.96.0 test --release --locked --manifest-path host/lib-e2e/rust/Cargo.toml
      - name: Half-close reply with independent Native peer
        shell: bash
        run: |
          peer=host/lib-e2e/rust/target/release/tcp-half-close-peer
          if [[ "$RUNNER_OS" == Windows ]]; then peer="$peer.exe"; fi
          node host/tcp/half-close-test.mjs "$peer"
          node host/tcp/half-close-test.mjs
      - name: Wasmi-only dependency contract
        shell: bash
        run: |
          cargo +1.96.0 tree --locked --manifest-path host/lib-e2e/rust/Cargo.toml > "$RUNNER_TEMP/wasmi-default-tree.txt"
          if grep -E 'wasmtime|cranelift' "$RUNNER_TEMP/wasmi-default-tree.txt"; then exit 1; fi
      - name: Preconnected TCP and frozen algorithm Lib
        shell: bash
        run: |
          binary=host/lib-e2e/rust/target/release/tcp-reference
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/tcp/test.mjs "$binary"
          stop=host/lib-e2e/rust/target/release/tcp-stop-reference
          if [[ "$RUNNER_OS" == Windows ]]; then stop="$stop.exe"; fi
          node host/tcp/fault-test.mjs "$stop"
          server=host/lib-e2e/rust/target/release/tcp-server-reference
          resident=host/lib-e2e/rust/target/release/resident-app-reference
          if [[ "$RUNNER_OS" == Windows ]]; then server="$server.exe"; resident="$resident.exe"; fi
          node host/tcp/server-test.mjs "$server" "$resident"
          write=host/lib-e2e/rust/target/release/tcp-write-reference
          if [[ "$RUNNER_OS" == Windows ]]; then write="$write.exe"; fi
          node host/tcp/write-test.mjs "$write"
          udp=host/lib-e2e/rust/target/release/udp-server-reference
          if [[ "$RUNNER_OS" == Windows ]]; then udp="$udp.exe"; fi
          node host/udp/native-test.mjs "$udp"
      - name: Same App and published Lib through real file Host
        shell: bash
        run: |
          binary=host/lib-e2e/rust/target/release/wasmc-lib-host-e2e
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/lib-e2e/test.mjs "$binary"
          core=host/lib-e2e/rust/target/release/corelib-io-reference
          if [[ "$RUNNER_OS" == Windows ]]; then core="$core.exe"; fi
          node host/corelib-io/test.mjs "$core"
          node host/corelib-io/lifetime-test.mjs "$core"
      - if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: runner.os != 'Windows'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - if: runner.os != 'Windows'
        name: Bun and restricted Deno composition
        shell: bash
        run: |
          binary=host/lib-e2e/rust/target/release/wasmc-lib-host-e2e
          completion=host/completion/rust/target/release/wasmc-completion-guard
          file=host/file-io/rust/target/release/wasmc-preopened-file-reference
          scoped=host/completion/rust/target/release/scoped-reference
          tcp=host/lib-e2e/rust/target/release/tcp-reference
          stop=host/lib-e2e/rust/target/release/tcp-stop-reference
          server=host/lib-e2e/rust/target/release/tcp-server-reference
          resident=host/lib-e2e/rust/target/release/resident-app-reference
          write=host/lib-e2e/rust/target/release/tcp-write-reference
          peer=host/lib-e2e/rust/target/release/tcp-half-close-peer
          bun host/tcp/half-close-test.mjs "$peer"
          deno run --allow-net=127.0.0.1 --allow-env=NODE_V8_COVERAGE --allow-run="$peer" host/tcp/half-close-test.mjs "$peer"
          deno run --allow-net=127.0.0.1 host/tcp/half-close-test.mjs
          bun host/tcp/half-close-test.mjs --characterize-js-peer
          core=host/lib-e2e/rust/target/release/corelib-io-reference
          udp=host/lib-e2e/rust/target/release/udp-server-reference
          bun host/udp/test.mjs
          bun host/udp/fault-test.mjs
          bun host/udp/retirement-test.mjs
          deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms host/udp/test.mjs
          deno run --allow-net=127.0.0.1 host/udp/fault-test.mjs
          deno run host/udp/retirement-test.mjs
          bun host/udp/native-test.mjs "$udp"
          deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms --allow-write=target/host-udp --allow-env=NODE_V8_COVERAGE --allow-run="$udp" host/udp/native-test.mjs "$udp"
          bun host/corelib-io/test.mjs "$core"
          deno run --allow-read=current,host/corelib-io,standard/corelib,target/corelib-io --allow-write=target/corelib-io --allow-env=NODE_V8_COVERAGE --allow-run="$core" host/corelib-io/test.mjs "$core"
          bun host/corelib-io/lifetime-test.mjs "$core"
          deno run --allow-read=standard/corelib,target/corelib-io --allow-env=NODE_V8_COVERAGE --allow-run="$core" host/corelib-io/lifetime-test.mjs "$core"
          bun host/tcp/write-test.mjs "$write"
          bun host/tcp/stop-failure-test.mjs
          deno run host/tcp/stop-failure-test.mjs
          bun host/tcp/driver-error-test.mjs
          deno run host/tcp/driver-error-test.mjs
          bun host/file-io/retirement-test.mjs
          deno run host/file-io/retirement-test.mjs
          bun host/file-io/write-snapshot-test.mjs
          deno run host/file-io/write-snapshot-test.mjs
          bun host/file-io/read-completion-test.mjs
          deno run host/file-io/read-completion-test.mjs
          bun host/tcp/stream-snapshot-test.mjs
          deno run host/tcp/stream-snapshot-test.mjs
          bun host/tcp/buffer-budget-test.mjs
          deno run host/tcp/buffer-budget-test.mjs
          bun host/tcp/completion-quarantine-test.mjs --real-tcp
          deno run --allow-net=127.0.0.1 host/tcp/completion-quarantine-test.mjs --real-tcp
          bun host/corelib-io/snapshot-test.mjs
          deno run --allow-read=standard/corelib,current,host/corelib-io host/corelib-io/snapshot-test.mjs
          bun host/tcp/driver-retirement-test.mjs --real-tcp
          deno run --allow-net=127.0.0.1 host/tcp/driver-retirement-test.mjs --real-tcp
          bun host/tcp/supervisor-test.mjs
          deno run host/tcp/supervisor-test.mjs
          deno run --allow-net=127.0.0.1 --allow-env=NODE_V8_COVERAGE --allow-run="$write" host/tcp/write-test.mjs "$write"
          bun host/tcp/server-test.mjs "$server" "$resident"
          mkdir -p target/host-tcp-app
          deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms,target --allow-write=target/host-tcp-app --allow-env=NODE_V8_COVERAGE --allow-run="$server,$resident" host/tcp/server-test.mjs "$server" "$resident"
          bun host/tcp/test.mjs "$tcp"
          deno run --allow-net=127.0.0.1 --allow-read=libs/wasmc-owned-algorithms --allow-env=NODE_V8_COVERAGE --allow-run="$tcp" host/tcp/test.mjs "$tcp"
          bun host/tcp/fault-test.mjs "$stop"
          deno run --allow-net=127.0.0.1 --allow-env=NODE_V8_COVERAGE --allow-run="$stop" host/tcp/fault-test.mjs "$stop"
          bun host/completion/scoped-test.mjs "$scoped"
          deno run --allow-env=NODE_V8_COVERAGE --allow-run="$scoped,$(command -v deno)" host/completion/scoped-test.mjs "$scoped"
          bun host/completion/lifetime-test.mjs
          deno run host/completion/lifetime-test.mjs
          bun host/completion/fault-test.mjs
          deno run host/completion/fault-test.mjs
          bun host/file-io/test.mjs "$file"
          bun host/completion/test.mjs "$completion"
          deno run --allow-env=NODE_V8_COVERAGE --allow-run="$completion" host/completion/test.mjs "$completion"
          bun host/lib-e2e/test.mjs "$binary"
          mkdir -p target/host-file-tmp
          TMPDIR="$PWD/target/host-file-tmp" deno run --allow-read=target --allow-write=target --allow-env=TMPDIR,NODE_V8_COVERAGE --allow-run="$file" host/file-io/test.mjs "$file"
          TMPDIR="$PWD/target/host-file-tmp" deno run --allow-read=current,libs/wasmc-owned-algorithms,host/completion,host/lib-e2e,target --allow-write=target --allow-env=TMPDIR,NODE_V8_COVERAGE --allow-run="$binary" host/lib-e2e/test.mjs "$binary"
      - name: Optional Wasmtime profile qualification
        shell: bash
        run: |
          cargo +1.96.0 clippy --locked --manifest-path host/lib-e2e/rust/Cargo.toml --features wasmtime-engine --all-targets -- -D warnings
          cargo +1.96.0 test --release --locked --manifest-path host/lib-e2e/rust/Cargo.toml --features wasmtime-engine
          cargo +1.96.0 build --release --locked --manifest-path host/lib-e2e/rust/Cargo.toml --features wasmtime-engine
          server=host/lib-e2e/rust/target/release/tcp-server-reference
          resident=host/lib-e2e/rust/target/release/resident-app-reference
          if [[ "$RUNNER_OS" == Windows ]]; then server="$server.exe"; resident="$resident.exe"; fi
          node host/tcp/server-test.mjs "$server" "$resident" --wasmtime
          core=host/lib-e2e/rust/target/release/corelib-io-reference
          if [[ "$RUNNER_OS" == Windows ]]; then core="$core.exe"; fi
          node host/corelib-io/test.mjs "$core" --wasmtime
          node host/corelib-io/lifetime-test.mjs "$core" --wasmtime
          udp=host/lib-e2e/rust/target/release/udp-server-reference
          if [[ "$RUNNER_OS" == Windows ]]; then udp="$udp.exe"; fi
          node host/udp/native-test.mjs "$udp" --wasmtime
          benchmark=host/lib-e2e/rust/target/release/resident-benchmark
          if [[ "$RUNNER_OS" == Windows ]]; then benchmark="$benchmark.exe"; fi
          node host/tcp/benchmark.mjs "$benchmark" target/host-tcp-app/guest.wasm --wasmtime
          if [[ "$RUNNER_OS" != Windows ]]; then
            bun host/udp/native-test.mjs "$udp" --wasmtime
            deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms --allow-write=target/host-udp --allow-env=NODE_V8_COVERAGE --allow-run="$udp" host/udp/native-test.mjs "$udp" --wasmtime
            bun host/corelib-io/test.mjs "$core" --wasmtime
            deno run --allow-read=current,host/corelib-io,standard/corelib,target/corelib-io --allow-write=target/corelib-io --allow-env=NODE_V8_COVERAGE --allow-run="$core" host/corelib-io/test.mjs "$core" --wasmtime
            bun host/corelib-io/lifetime-test.mjs "$core" --wasmtime
            deno run --allow-read=standard/corelib,target/corelib-io --allow-env=NODE_V8_COVERAGE --allow-run="$core" host/corelib-io/lifetime-test.mjs "$core" --wasmtime
            bun host/tcp/server-test.mjs "$server" "$resident" --wasmtime
            deno run --allow-net=127.0.0.1 --allow-read=current,host/lib-e2e,libs/wasmc-owned-algorithms,target --allow-write=target/host-tcp-app --allow-env=NODE_V8_COVERAGE --allow-run="$server,$resident" host/tcp/server-test.mjs "$server" "$resident" --wasmtime
            bun host/tcp/benchmark.mjs "$benchmark" target/host-tcp-app/guest.wasm --wasmtime
            deno run --allow-read=libs/wasmc-owned-algorithms,target/host-tcp-app --allow-env=NODE_V8_COVERAGE --allow-run="$benchmark" host/tcp/benchmark.mjs "$benchmark" target/host-tcp-app/guest.wasm --wasmtime
          fi
      - name: Public integrity
        if: runner.os == 'Linux'
        run: ./scripts/validate-maintainer.sh
      - name: Exact-source evidence scope
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
        run: |
          printf '%s\n' "Source $SOURCE; $RUNNER_OS/$RUNNER_ARCH; 76 guard transitions, 10 fault controls, 15 guard/owner Rust tests, 40000 scoped and supervisor cycles, 8 binary-contract/TCP/UDP/listener Rust tests, Native-peer half-close reply proof, 8-process identity, 20 file/App/Lib cases, 8 TCP/Lib pairs, 4 read-stop pairs with 9 controls, 19 resident App/Lib server connections, 1000 resident calls per engine and 8 listener controls; UDP8messages/5calls/3rejects plus11JScontrols/12controlled-retirement-controls; file read8/write7, stream7/buffer10/Core-packing7/malformed-completion6plus1realTCP controls; Bun JS-client half-close is separate characterization, not positive parity; guest trap poisons with no replay, not guest async ABI or generic failed-shutdown qualification" >> "$GITHUB_STEP_SUMMARY"
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - name: Real browser App Lib and ownership probes
        shell: bash
        env:
          BROWSER: ${{ matrix.engine }}
          SOURCE: ${{ github.sha }}
        run: |
          node host/browser/server.mjs > "$RUNNER_TEMP/wasmc-browser-url.txt" 2> "$RUNNER_TEMP/wasmc-browser-server.err" &
          server_pid=$!
          cd "$RUNNER_TEMP"
          trap 'npm exec --yes --package=@playwright/cli@0.1.19 -- playwright-cli -s=wasmc-host-ci close || true; kill "$server_pid" || true' EXIT
          npm exec --yes --package=@playwright/cli@0.1.19 -- playwright-cli install-browser "$BROWSER" --with-deps
          url=$(head -n 1 "$RUNNER_TEMP/wasmc-browser-url.txt")
          [[ "$url" == http://127.0.0.1:* ]] || { cat "$RUNNER_TEMP/wasmc-browser-server.err"; exit 1; }
          npm exec --yes --package=@playwright/cli@0.1.19 -- playwright-cli -s=wasmc-host-ci open "$url" --browser "$BROWSER"
          npm exec --yes --package=@playwright/cli@0.1.19 -- playwright-cli -s=wasmc-host-ci --raw eval 'async () => { const receipt=await globalThis.receiptPromise; if(!receipt.accepted) throw Error(receipt.error); return receipt; }' > "$RUNNER_TEMP/wasmc-browser-receipt.json"
          node --input-type=module -e 'import{readFileSync}from"node:fs";import assert from"node:assert/strict";const r=JSON.parse(readFileSync(process.argv[1]));assert.ok(r.accepted&&r.no_replay&&r.trap_poisoned&&r.resource_cleanup&&r.quarantine_retained);assert.equal(r.resident_calls,1000);assert.equal(r.guard_cases,4);assert.equal(r.stop_failure_cases,4);assert.equal(r.supervisor_cases,1);assert.equal(r.kernel_core_cases,4);console.log(JSON.stringify(r));' "$RUNNER_TEMP/wasmc-browser-receipt.json"
          printf '%s\n' "Source $SOURCE; real $BROWSER; App/Lib1000 resident calls; four Core/guard/quarantine probes; no raw TCP/mobile claim" >> "$GITHUB_STEP_SUMMARY"
  required:
    if: always()
    needs: [composition, browser, stream-shapes, mobile-compile]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.composition.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          STREAM_RESULT: ${{ needs.stream-shapes.result }}
          MOBILE_RESULT: ${{ needs.mobile-compile.result }}
        run: test "$RESULT" = success && test "$BROWSER_RESULT" = success && test "$STREAM_RESULT" = success && test "$MOBILE_RESULT" = success
