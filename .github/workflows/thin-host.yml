name: Public Core Host contract
on:
  push:
    branches: [main, work/thin-host-contract, work/host-kernel-engine-parity, work/host-native-owner-supervisor, work/host-scoped-owner-lifetime]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.1
      - run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.96.0 fmt --check --manifest-path host/v0/rust/Cargo.toml
      - run: cargo +1.96.0 clippy --locked --manifest-path host/v0/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.96.0 build --release --locked --manifest-path host/v0/rust/Cargo.toml
      - name: Kernel Wasmi-only dependency contract
        shell: bash
        run: |
          cargo +1.96.0 tree --locked --manifest-path host/v0/rust/Cargo.toml > "$RUNNER_TEMP/wasmi-kernel-tree.txt"
          if grep -E 'wasmtime|cranelift' "$RUNNER_TEMP/wasmi-kernel-tree.txt"; then exit 1; fi
      - name: Node / native Wasmi same-source tests
        shell: bash
        run: |
          binary=host/v0/rust/target/release/wasmc-host-contract-reference
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/v0/test.mjs "$binary"
          node host/v0/core-test.mjs "$binary"
      - if: runner.os != 'Windows'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - if: runner.os != 'Windows'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.4
      - if: runner.os != 'Windows'
        name: Bun / Deno native reference parity
        shell: bash
        run: |
          binary=host/v0/rust/target/release/wasmc-host-contract-reference
          bun host/v0/test.mjs "$binary"
          bun host/v0/core-test.mjs "$binary"
          deno run --allow-env=NODE_V8_COVERAGE --allow-read=host/v0 --allow-run="$binary" host/v0/test.mjs "$binary"
          deno run --allow-env=NODE_V8_COVERAGE --allow-read=current,host/v0,target/thin-host --allow-write=target/thin-host --allow-run="$binary" host/v0/core-test.mjs "$binary"
      - name: Optional Wasmtime kernel Core binding
        shell: bash
        run: |
          cargo +1.96.0 clippy --locked --manifest-path host/v0/rust/Cargo.toml --features wasmtime-engine --all-targets -- -D warnings
          cargo +1.96.0 build --release --locked --manifest-path host/v0/rust/Cargo.toml --features wasmtime-engine
          binary=host/v0/rust/target/release/wasmc-host-contract-reference
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          node host/v0/core-test.mjs "$binary" --wasmtime
          if [[ "$RUNNER_OS" != Windows ]]; then
            bun host/v0/core-test.mjs "$binary" --wasmtime
            deno run --allow-env=NODE_V8_COVERAGE --allow-read=current,host/v0,target/thin-host --allow-write=target/thin-host --allow-run="$binary" host/v0/core-test.mjs "$binary" --wasmtime
          fi
      - name: Exact-source scope
        shell: bash
        env:
          SOURCE: ${{ github.sha }}
        run: |
          printf '%s\n' "Source $SOURCE; $RUNNER_OS/$RUNNER_ARCH; memory simulator, not real I/O" >> "$GITHUB_STEP_SUMMARY"
  required:
    if: always()
    needs: reference
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.reference.result }}
        run: test "$RESULT" = success
