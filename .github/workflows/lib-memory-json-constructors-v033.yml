name: JSON constructor successor 0.2.1
on:
  push:
    branches: [work/WS-20261026-lib-memory-release-v031]
    paths: ['.agents/workstreams/WS-20261026-lib-memory-release-v031/producer-json-constructors/**', '.github/workflows/lib-memory-json-constructors-v033.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  json:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/lib-memory-v031
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Prepare only changed JSON 0.2.1 candidate
        run: |
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage('.').free
          print({'free_bytes':free,'floor_bytes':12*2**30,'changed_package':'wasmc_json_memory_constructors_v033'})
          assert free>=12*2**30
          PY
          node .agents/workstreams/WS-20261026-lib-memory-release-v031/producer-json-constructors/materialize.mjs "$RUNNER_TEMP/json-constructors-v033"
          mkdir -p target/json-constructors-evidence
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target/lib-memory-v031
          key: json-constructors-linux-rust196-${{ hashFiles('.agents/workstreams/WS-20261026-lib-memory-release-v031/producer-json-constructors/inputs/json007.Cargo.lock', '.agents/workstreams/WS-20261026-lib-memory-release-v031/producer-json-constructors/libspec/**') }}
          restore-keys: |
            json-constructors-linux-rust196-
            json-direct-linux-rust196-
            lib-memory-linux-rust196-
      - name: Rust tests and portable changed package
        run: |
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup default 1.96.0
          rustup target add wasm32-unknown-unknown
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/json-constructors-v033/Cargo.toml"
          set -o pipefail
          cargo test --offline --locked --manifest-path "$RUNNER_TEMP/json-constructors-v033/Cargo.toml" 2>&1 | tee target/json-constructors-evidence/native.log
          cargo build --offline --locked --release --target wasm32-unknown-unknown --manifest-path "$RUNNER_TEMP/json-constructors-v033/Cargo.toml" 2>&1 | tee target/json-constructors-evidence/wasm.log
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/wasmc_json_memory_constructors_v033.wasm" target/json-constructors-evidence/json-raw.wasm
          cp "$RUNNER_TEMP/json-constructors-v033/source-receipt.json" target/json-constructors-evidence/source-receipt.json
          cp "$RUNNER_TEMP/json-constructors-v033/Cargo.lock" target/json-constructors-evidence/Cargo.lock
          sha256sum target/json-constructors-evidence/json-raw.wasm > target/json-constructors-evidence/sha256.txt
          rustc -vV > target/json-constructors-evidence/rustc.txt
          git rev-parse HEAD > target/json-constructors-evidence/source.txt
          python3 - <<'PY'
          import os,shutil
          size=sum(os.path.getsize(os.path.join(p,n)) for p,_,ns in os.walk(os.environ['CARGO_TARGET_DIR']) for n in ns)
          print({'target_bytes':size,'budget_bytes':2*2**30,'free_bytes':shutil.disk_usage('.').free})
          assert size<2*2**30
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: json-constructors-v033
          path: target/json-constructors-evidence/**
          retention-days: 30
          if-no-files-found: error
