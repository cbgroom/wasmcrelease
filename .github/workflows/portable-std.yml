name: Portable Std dual-consumer qualification
on:
  push:
    branches: [main, work/portable-std-qualified-candidate]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-std-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    name: Std ${{ matrix.os }} ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        runtime: [node18, node22, node26, bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.runtime == 'node18' && '18.19.1' || matrix.runtime == 'node22' && '22.0.0' || '26.5.1' }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.9.4'
      - name: Actual paired calls, identity and rejection controls
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p target/portable-std
          case "$RUNTIME" in
            bun) runner=(bun);;
            deno) runner=(deno run --allow-read --allow-env=GITHUB_SHA);;
            *) runner=(node);;
          esac
          "${runner[@]}" admission/portable-std-v0/test.mjs | tee target/portable-std/receipt.json
          cat target/portable-std/receipt.json >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-std-${{ matrix.os }}-${{ matrix.runtime }}
          path: target/portable-std/receipt.json
          if-no-files-found: error
          retention-days: 14
  native:
    name: Std ${{ matrix.os }} Wasmi and Wasmtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Pin Rust toolchain
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Validate all input identities
        run: node admission/portable-std-v0/test.mjs
      - name: Build open glue only and execute both engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/portable-std
          cargo +1.96.0 test --locked --manifest-path host/lib-e2e/rust/Cargo.toml --test portable_std --features wasmtime-engine -- --nocapture 2>&1 | tee target/portable-std/native.log
          printf 'Portable Std native paired tests passed at %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-std-${{ matrix.os }}-native
          path: target/portable-std/native.log
          if-no-files-found: error
          retention-days: 14
