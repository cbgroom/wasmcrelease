name: Native operation memory-owned transfer
on:
  push:
    branches: [work/WS-20261026-lib-memory-release-v031]
    paths:
      - 'host/runtime/lib-boundary/native-linux-operation/**'
      - '.agents/workstreams/WS-20261026-lib-memory-release-v031/operation-memory-fixture.c'
      - '.agents/workstreams/WS-20261026-lib-memory-release-v031/test-operation-memory.mjs'
      - '.agents/workstreams/WS-20261026-lib-memory-release-v031/build-endpoint-operation-candidate.mjs'
      - '.agents/workstreams/WS-20261026-lib-memory-release-v031/candidate-host/native-linux-operation/**'
      - '.agents/workstreams/WS-20261026-lib-memory-release-v031/verify-operation-executor-reuse.py'
      - '.agents/workstreams/WS-20261026-lib-memory-release-v031/native-platform/linux-endpoint/**'
      - '.github/workflows/lib-memory-operation-v031.yml'
permissions:
  contents: read
jobs:
  native-operation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.5.1'
      - name: Build changed Native executor and verify single-call operation behavior
        shell: bash
        run: |
          set -euo pipefail
          own=.agents/workstreams/WS-20261026-lib-memory-release-v031
          out="$RUNNER_TEMP/operation-memory-evidence"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source.txt"
          uname -a > "$out/host.txt"
          node --version > "$out/node.txt"
          python3 - <<'PY'
          import shutil
          free=shutil.disk_usage('.').free
          print({'free_bytes':free,'minimum_bytes':12*2**30,'disposable_target_budget_bytes':2*2**30})
          assert free>=12*2**30
          PY
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustc +1.96.0 -vV > "$out/rustc.txt"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/operation-memory-target"
          set +e
          python3 "$own/verify-operation-executor-reuse.py" "$out/rustc.txt" > "$out/executor-reuse.json"
          reuse_status=$?
          set -e
          if [ "$reuse_status" -eq 0 ]; then
            cp "$own/candidate-host/native-linux-operation/executor" "$out/executor"
            printf 'Reused independently qualified identical executor; no Rust rebuild.\n' > "$out/build.log"
          elif [ "$reuse_status" -eq 1 ]; then
            cargo +1.96.0 build --locked --release --manifest-path host/runtime/lib-boundary/native-linux-operation/Cargo.toml --features operation-bridge 2>&1 | tee "$out/build.log"
            cp "$CARGO_TARGET_DIR/release/wasmc-lib-boundary-native-linux-operation" "$out/executor"
          else
            cat "$out/executor-reuse.json"
            exit 1
          fi
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -pthread "$own/operation-memory-fixture.c" -o "$out/fixture.so"
          node "$own/build-endpoint-operation-candidate.mjs" "$out" 2>&1 | tee "$out/endpoint-build.log"
          timeout 45s node "$own/test-operation-memory.mjs" "$out/executor" "$out/fixture.so" "$out/roots/wasmc-system-linux-endpoint/0.1.0" "$out/operation-memory.json" 2>&1 | tee "$out/operation-memory.log"
          if [ -d "$CARGO_TARGET_DIR" ]; then
            du -sk "$CARGO_TARGET_DIR" > "$out/target-size.txt"
            test "$(du -sk "$CARGO_TARGET_DIR" | cut -f1)" -lt 2097152
          else
            printf '0\t(no target directory; reused qualified executor)\n' > "$out/target-size.txt"
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operation-memory-capacity
          path: ${{ runner.temp }}/operation-memory-evidence/**
          retention-days: 7
