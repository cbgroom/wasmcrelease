name: WAsmCSystemAgentLab
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.system-agent-lab
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  WAsmCSystemAgentLab:
    type: application
    platform: iOS
    info:
      path: ${WASMC_SYSTEM_AGENT_LAB_INFO_PLIST}
      properties:
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App
        excludes: [Info.plist]
      - path: ../../../../libsrc/wasmc-system-ios-app-surface-control/platform/ios/Sources/WebViewSurfaceProvider.swift
      - path: ../../../../libsrc/wasmc-system-ios-network-path/platform/ios/Sources/NetworkPathProvider.swift
      - path: ../../../../host/tests/ios-app-capability/Host/FixedHost.swift
    settings:
      base:
        PRODUCT_NAME: WAsmCSystemAgentLab
  WAsmCSystemAgentLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WAsmCSystemAgentLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.system-agent-lab.uitests
        TEST_TARGET_NAME: WAsmCSystemAgentLab

