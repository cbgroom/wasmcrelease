name: WAsmCIOSAppCapability
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.app-capability-lab
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
targets:
  WAsmCIOSAppCapability:
    type: application
    platform: iOS
    sources:
      - path: Host
      - path: Profile
      - path: Providers
    settings:
      base:
        PRODUCT_NAME: WAsmCIOSAppCapability
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../host/tests/ios-app-capability/Providers/NetworkAdapter.h
        OTHER_LDFLAGS: ["-framework", "Metal", "-framework", "Security", "-lsqlite3"]
