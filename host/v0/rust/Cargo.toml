[package]
name = "wasmc-host-contract-reference"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
[workspace]
[features]
default = []
wasmtime-engine = ["dep:wasmtime"]
[dependencies]
serde_json = "1"
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "auto-dispatch"] }
wasmtime = { version = "=47.0.4", optional = true, default-features = false, features = ["runtime", "cranelift"] }
