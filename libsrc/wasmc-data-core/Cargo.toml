[package]
name = "wasmc-data-core-public"
version = "0.0.1"
edition = "2021"
publish = false
license-file = "../../LICENSE"
description = "Portable WAsmC data batch semantics backed by Arrow-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.62.0"
arrow-schema = "=60.0.0"
arrow-array = "=60.0.0"
arrow-select = "=60.0.0"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
