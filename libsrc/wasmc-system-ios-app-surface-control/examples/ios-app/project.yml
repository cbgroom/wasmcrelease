name: WAsmCIOSSurfaceControl
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.surface-control-lab
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
targets:
  WAsmCIOSSurfaceControl:
    type: application
    platform: iOS
    info:
      path: ${WASMC_IOS_SURFACE_INFO_PLIST}
      properties:
        CFBundleShortVersionString: "0.0.2"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App
        excludes: [Info.plist]
      - path: ../../platform/ios/Sources/SurfaceControlProvider.swift
      - path: ../../platform/ios/Sources/PiPSurfaceProvider.swift
      - path: ../../../../host/tests/ios-app-capability/Host/FixedHost.swift
    settings:
      base:
        PRODUCT_NAME: WAsmCIOSSurfaceControl
  WAsmCIOSSurfaceControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WAsmCIOSSurfaceControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.surface-control-lab.uitests
        TEST_TARGET_NAME: WAsmCIOSSurfaceControl
