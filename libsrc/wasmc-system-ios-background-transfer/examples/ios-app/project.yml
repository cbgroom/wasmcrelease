name: WAsmCIOSBackgroundTransfer
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.background-transfer-lab
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  WAsmCIOSBackgroundTransfer:
    type: application
    platform: iOS
    info:
      path: ${WASMC_IOS_BACKGROUND_TRANSFER_INFO_PLIST}
      properties:
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App
        excludes: [Info.plist]
      - path: ../../platform/ios/Sources
      - path: ../../../../host/tests/ios-app-capability/Host/FixedHost.swift
    settings:
      base:
        PRODUCT_NAME: WAsmCIOSBackgroundTransfer
  WAsmCIOSBackgroundTransferUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WAsmCIOSBackgroundTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wasmc.background-transfer-lab.uitests
        TEST_TARGET_NAME: WAsmCIOSBackgroundTransfer
