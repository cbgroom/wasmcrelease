[package]
name = "wasmc-core-runtime"
version = "0.1.0"
edition = "2021"
description = "Bounded Wasmi completion and Wasmtime promotion SDK for WebAssembly Core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yxsicd/wasmc"
readme = "README.md"
keywords = ["wasm", "wasmi", "wasmtime", "runtime"]
categories = ["wasm", "development-tools"]
# Repository conformance uses the public release tree, which is not shipped
# inside this standalone SDK crate. Keep its artifact fixture test out of the
# packaged crate; ordinary self-contained SDK tests remain packaged.
exclude = ["tests/public_standard_graph.rs"]

[features]
default = ["core-runtime-sdk"]
wasmi-runtime = ["dep:wasmi"]
wasmtime-runtime = ["dep:wasmtime"]
core-runtime-sdk = ["wasmi-runtime", "wasmtime-runtime"]

[dependencies]
sha2 = "0.10"
wasmi = { version = "=2.0.0", optional = true, default-features = false, features = ["std", "validate", "auto-dispatch"] }
wasmtime = { version = "=47.0.4", optional = true, default-features = false, features = ["runtime", "cranelift"] }

[dev-dependencies]
wat = "1.238"
# Test-only engine support for Std1.4's typed function references. This does
# not expand the SDK's production engine configuration or imply Wasmi parity.
wasmtime = { version = "=47.0.4", default-features = false, features = ["runtime", "cranelift", "gc"] }
