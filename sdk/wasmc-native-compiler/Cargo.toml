[package]
name = "wasmc-native-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
sha2 = "0.10"
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "auto-dispatch"] }
wasmtime = { version = "=47.0.4", default-features = false, features = ["runtime", "cranelift"] }

[build-dependencies]
sha2 = "0.10"
wasmtime = { version = "=47.0.4", default-features = false, features = ["runtime", "cranelift"] }

[[bin]]
name = "wasmc"
path = "src/main.rs"
